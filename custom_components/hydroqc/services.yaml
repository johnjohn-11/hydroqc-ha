# Service definitions for Hydro-Québec integration
refresh_data:
  target:
    entity:
      integration: hydroqc
  fields: {}

sync_consumption_history:
  target:
    entity:
      integration: hydroqc
  fields:
    days_back:
      required: false
      default: 731
      example: 731
      selector:
        number:
          min: 1
          max: 2000
          mode: box

create_peak_event:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hydroqc
    date:
      required: true
      example: "2026-01-15"
      selector:
        date:
    time_slot:
      required: true
      example: "AM"
      selector:
        select:
          options:
            - label: "Morning (6h-10h)"
              value: "AM"
            - label: "Evening (16h-20h)"
              value: "PM"
